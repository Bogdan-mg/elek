# Rooktest van de app: laadt ze in Chromium en controleert de belangrijkste
# stappen. Het project zelf heeft geen dependencies; Playwright is enkel voor
# de test.
name: Rooktest

on:
  push:
    branches: [ "claude/windows-ipad-app-dev-pmwuue" ]
  pull_request:
    branches: [ "claude/windows-ipad-app-dev-pmwuue" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Modules op syntaxfouten controleren
        run: |
          for f in js/*.js sw.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done

      - name: Versie in één bestand bouwen
        run: python3 tools/bouw-eenbestand.py

      - name: Playwright installeren
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Rooktest draaien
        run: npm test
